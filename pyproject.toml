[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decider-ai"
version = "1.3.0"
description = "One-pass typed decisions with StartLux and Decider models, bounded HTTP serving and CUDA inference"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "decider/_startlux/NOTICE.txt"]
authors = [{ name = "Mark Marosi" }]
dependencies = ["torch", "transformers>=5.17,<5.18", "flash-linear-attention", "numpy<2", "huggingface_hub", "jinja2"]

[project.optional-dependencies]
serve = ["fastapi", "uvicorn[standard]", "httpx"]
train = ["datasets", "accelerate", "scikit-learn", "pillow"]
games = ["gymnasium", "gym-super-mario-bros", "nes-py", "minigrid", "ale-py", "imageio"]
metal = ["mlx>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.urls]
Repository = "https://github.com/Mapika/decider"
Weights = "https://huggingface.co/Mapika/decider-2b"
Changelog = "https://github.com/Mapika/decider/blob/main/docs/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["decider*"]

[tool.setuptools.package-data]
"decider._startlux" = ["NOTICE.txt"]
